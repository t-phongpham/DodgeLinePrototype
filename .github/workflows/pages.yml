name: Publish Dodge Line Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify locally built game was included
        run: test -f web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
