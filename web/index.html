<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dodge Line</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0c1413;color:#e1e5d5;font:16px system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
    main{width:min(1280px,96vw,calc((100vh - 110px)*16/9))}header,footer{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0}h1{font-size:22px;margin:0}
    #game{position:relative;aspect-ratio:16/9;background:#080e0d;border:1px solid #435549}canvas{width:100%;height:100%;display:block;outline:0}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#0c1413}progress{width:260px;margin:12px auto;accent-color:#c6a753}
    button{background:#263b30;color:#f5edcf;border:1px solid #7a875d;border-radius:5px;padding:8px 16px;cursor:pointer}footer{color:#a8b4ab;font-size:14px}#error{white-space:pre-wrap;max-width:90%;color:#ffd0b0}a{color:#e1c77e}
  </style>
</head>
<body>
  <main>
    <header><h1>DODGE LINE / MIST VALLEY</h1><button id="fullscreen">Fullscreen</button></header>
    <div id="game">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Dodge Line game"></canvas>
      <div id="loading"><strong>Entering Mist Valley...</strong><progress id="progress" max="1" value="0"></progress><span id="error"></span></div>
    </div>
    <footer><span>Mouse &amp; keyboard · 1/2/3 build · Space start · P pause</span><span>Five stages · Online leaderboard</span></footer>
  </main>
  <script src="Build/Web.loader.js"></script>
  <script>
    window.dodgeLineReady = false;
    const canvas = document.getElementById('unity-canvas');
    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: 'Build/Web.data.unityweb',
      frameworkUrl: 'Build/Web.framework.js.unityweb',
      codeUrl: 'Build/Web.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "DodgeLinePrototype",
      productVersion: "1.0",
      devicePixelRatio: 1
    }, value => document.getElementById('progress').value = value).then(instance => {
      window.dodgeLineInstance = instance;
      window.dodgeLineReady = true;
      document.getElementById('loading').style.display = 'none';
      canvas.focus();
      document.getElementById('fullscreen').onclick = () => instance.SetFullscreen(1);
    }).catch(message => {
      window.dodgeLineLoadError = String(message);
      document.getElementById('error').textContent = 'Unable to load the game. Refresh the page or try a desktop browser.\n' + String(message);
    });
  </script>
</body>
</html>
